<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sachi Timeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/loader.css">
  <noscript>
    <style>
      .loader { display: none !important; }
      body.is-loading { overflow: auto !important; }
    </style>
  </noscript>
</head>
<body class="is-loading">

  <!-- ===== Loader ===== -->
  <div class="loader" id="loader" role="status" aria-live="polite" aria-label="読み込み中">
    <div class="loader__inner">
      <div class="loader__avatar-wrap">
        <div class="loader__avatar">
          <img src="assets/img/avatar.png" alt="" width="84" height="84">
        </div>
      </div>
      <div class="loader__title">Sachi Timeline</div>
      <div class="loader__dots">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div class="loader__progress" aria-hidden="true"></div>
  </div>

  <div class="bg-decor" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <header class="hero">
    <div class="hero__avatar">
      <img src="assets/img/avatar.png" alt="" width="96" height="96">
    </div>
    <h1 class="hero__title">Sachi Timeline</h1>
    <p class="hero__tagline">
      <a href="https://x.com/sachisuke_i" target="_blank" rel="noopener">@sachisuke_i</a> の<br>
      <strong>保護者向けグッズ交換ポスト</strong>を<br>
      自動でここに集めています。
    </p>
    <div class="hero__chips" id="keyword-chips"></div>
    <div class="hero__meta">
      <span class="dot-pulse"></span>
      <span id="last-updated">最終更新：読み込み中…</span>
    </div>
  </header>

  <main class="container">
    <section id="tweet-list" class="tweet-list" aria-live="polite">
      <div class="loading" id="loading">
        <div class="loading__dot"></div>
        <div class="loading__dot"></div>
        <div class="loading__dot"></div>
      </div>
    </section>

    <div class="empty" id="empty-state" hidden>
      <p>まだ該当するツイートはありません。</p>
    </div>
  </main>

  <footer class="footer">
    <p>By <a href="https://x.com/sachisuke_i" target="_blank" rel="noopener">@sachisuke_i</a></p>
  </footer>

  <script type="module" src="assets/js/main.js"></script>
  <script>
    // main.js が何らかの理由で動かない場合の保険（10秒で強制解除）
    setTimeout(() => {
      const l = document.getElementById('loader');
      if (l && !l.classList.contains('is-hidden')) {
        l.classList.add('is-hidden');
        document.body.classList.add('is-ready');
        document.body.classList.remove('is-loading');
        setTimeout(() => l.remove(), 700);
      }
    }, 10000);
  </script>
</body>
</html>
